<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222226" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Machined Hairline -->
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="8"
    fill="url(#bgGrad)"
    stroke="rgba(255, 255, 255, 0.14)"
    stroke-width="1.2"
  />

  <!-- Four-Point Path Sparkle (North Star) -->
  <path
    d="M16 6.5 C16 11.2 11.2 16 6.5 16 C11.2 16 16 20.8 16 25.5 C16 20.8 20.8 16 25.5 16 C20.8 16 16 11.2 16 6.5 Z"
    fill="url(#starGrad)"
  />

  <!-- Subtle Guidance Satellite Dot -->
  <circle cx="23.5" cy="8.5" r="2" fill="#FDE047" opacity="0.95" />
</svg>
